name: attendance_app
description: Application Flutter de gestion des présences et pointages, intégrée avec Google Sheets.
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.9.2

dependencies:
  flutter:
    sdk: flutter
  google_fonts: ^6.1.0
  intl: ^0.18.1
  equatable: ^2.0.5
  go_router: ^13.0.1
  http: ^1.0.0
  dartz: ^0.10.1
  flutter_bloc: ^8.1.3
  dio: ^5.0.0
  get_it: ^7.6.4
  injectable: ^2.3.2
  json_annotation: ^4.8.1
  cupertino_icons: ^1.0.8
  google_sign_in: ^6.1.6
  googleapis: ^11.4.0
  googleapis_auth: ^1.5.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  build_runner: ^2.4.6
  json_serializable: ^6.7.1
  injectable_generator: ^2.4.1
  flutter_gen_runner: ^5.3.1
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.13.1
flutter_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/logo.png"

flutter:
  uses-material-design: true

  assets:
    - assets/images/splash1.png
    - assets/images/logo1.png
    - assets/images/avatar_f.png
    - assets/images/avatar_g.png
    - assets/logo.png
